<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crown &amp; Grove — Logo Animation Studio</title>
  <style>
    body { font-family: Arial, sans-serif; background: #F7F4EC; color: #1A1A1A; padding: 32px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    p.hint { color: #777; font-size: 13px; margin: 0 0 20px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      font: inherit; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      background: #1A1A1A; color: #D4AF37; border: 0; border-radius: 3px;
      padding: 11px 16px; cursor: pointer; font-size: 12px;
    }
    button:hover { background: #1B4D3E; }
    label { font-size: 13px; align-self: center; margin-left: 8px; }
    #status { font-size: 13px; color: #1B4D3E; margin-top: 16px; min-height: 20px; }
    canvas { display: block; width: 420px; height: 420px; margin-top: 24px; background: #fff; border: 1px solid #DDD8CC; }
  </style>
</head>
<body>
  <h1>Crown &amp; Grove — Logo Animation Studio</h1>
  <p class="hint">Five 1080&times;1080 animation styles. Click one to record a 4.2 second WebM and download it.</p>
  <div class="controls">
    <button data-style="draw">01 Draw &amp; Reveal</button>
    <button data-style="rise">02 Fade &amp; Rise</button>
    <button data-style="stamp">03 Stamp Impact</button>
    <button data-style="orbit">04 Orbit Spin</button>
    <button data-style="glow">05 Glow Pulse</button>
    <label><input type="checkbox" id="dark" /> Dark version</label>
  </div>
  <div id="status">Idle</div>
  <canvas id="c" width="1080" height="1080"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const darkToggle = document.getElementById('dark');

    const GOLD = '#D4AF37';
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOut = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const easeOutBack = (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
    const step = (t, start, dur) => Math.max(0, Math.min(1, (t - start) / dur));

    function badge(ctx, cx, cy, scale, dark, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);

      ctx.strokeStyle = GOLD;
      ctx.lineWidth = 11;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, 360, 0, Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = 'rgba(212,175,55,0.5)';
      ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.arc(0, 0, 322, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = GOLD;
      ctx.beginPath(); ctx.arc(0, -341, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 341, 9, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = dark ? GOLD : '#1A1A1A';
      ctx.font = '600 283px "Helvetica Neue", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('C&G', 0, 100);
      ctx.restore();
    }

    function tagline(ctx, cx, y, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = GOLD;
      ctx.font = '500 30px "Helvetica Neue", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '6px';
      ctx.fillText('WHERE STRATEGY MEETS CREATION', cx, y);
      ctx.letterSpacing = '0px';
      ctx.restore();
    }

    const CX = 540, CY = 470;

    function draw(t, style, dark) {
      ctx.fillStyle = dark ? '#1A1A1A' : '#FFFFFF';
      ctx.fillRect(0, 0, 1080, 1080);

      if (style === 'draw') {
        const p1 = ease(step(t, 0.1, 1.0));
        const p2 = ease(step(t, 0.5, 1.0));
        const p3 = ease(step(t, 1.1, 0.4));
        const p4 = ease(step(t, 1.3, 0.7));
        const p5 = ease(step(t, 1.9, 0.6));

        if (p1 > 0) {
          ctx.save(); ctx.strokeStyle = GOLD; ctx.lineWidth = 11; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.arc(CX, CY, 360, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p1); ctx.stroke(); ctx.restore();
        }
        if (p2 > 0) {
          ctx.save(); ctx.strokeStyle = 'rgba(212,175,55,0.5)'; ctx.lineWidth = 4.5;
          ctx.beginPath(); ctx.arc(CX, CY, 322, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p2); ctx.stroke(); ctx.restore();
        }
        if (p3 > 0) {
          ctx.save(); ctx.globalAlpha = p3; ctx.fillStyle = GOLD;
          ctx.beginPath(); ctx.arc(CX, CY - 341, 9, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(CX, CY + 341, 9, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }
        if (p4 > 0) {
          ctx.save(); ctx.globalAlpha = p4;
          const s = 0.92 + 0.08 * p4;
          ctx.translate(CX, CY + 100); ctx.scale(s, s);
          ctx.fillStyle = dark ? GOLD : '#1A1A1A';
          ctx.font = '600 283px "Helvetica Neue", Arial, sans-serif';
          ctx.textAlign = 'center'; ctx.fillText('C&G', 0, 0); ctx.restore();
        }
        tagline(ctx, CX, 940, p5);
        return;
      }

      if (style === 'rise') {
        const p = ease(step(t, 0.15, 0.9));
        const rise = (1 - p) * 40;
        badge(ctx, CX, CY + rise, 0.94 + 0.06 * p, dark, p);
        tagline(ctx, CX, 940, ease(step(t, 1.1, 0.6)));
        return;
      }

      if (style === 'stamp') {
        const hit = step(t, 0.2, 0.32);
        const p = easeOutBack(hit);
        const scale = 1.22 + (1 - 1.22) * p;
        // impact ring pulse
        const pulse = step(t, 0.2, 0.55);
        if (pulse > 0 && pulse < 1) {
          ctx.save();
          ctx.globalAlpha = (1 - pulse) * 0.35;
          ctx.strokeStyle = GOLD; ctx.lineWidth = 8;
          ctx.beginPath(); ctx.arc(CX, CY, 360 + 160 * pulse, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }
        badge(ctx, CX, CY, scale, dark, Math.min(1, hit * 3));
        tagline(ctx, CX, 940, ease(step(t, 0.85, 0.5)));
        return;
      }

      if (style === 'orbit') {
        const p = ease(step(t, 0.1, 1.3));
        ctx.save();
        ctx.globalAlpha = p;
        ctx.translate(CX, CY);
        ctx.rotate(easeInOut(step(t, 0, 1.3)) * Math.PI * 4);
        ctx.strokeStyle = GOLD; ctx.lineWidth = 11; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(0, 0, 360, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2); ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = p;
        ctx.translate(CX, CY);
        ctx.rotate(-easeInOut(step(t, 0, 1.3)) * Math.PI * 2);
        ctx.strokeStyle = 'rgba(212,175,55,0.5)'; ctx.lineWidth = 4.5;
        ctx.beginPath(); ctx.arc(0, 0, 322, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();

        const letters = ease(step(t, 0.95, 0.6));
        ctx.save(); ctx.globalAlpha = letters; ctx.fillStyle = GOLD;
        ctx.beginPath(); ctx.arc(CX, CY - 341, 9, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(CX, CY + 341, 9, 0, Math.PI * 2); ctx.fill(); ctx.restore();

        ctx.save(); ctx.globalAlpha = letters;
        const s = 0.9 + 0.1 * letters;
        ctx.translate(CX, CY + 100); ctx.scale(s, s);
        ctx.fillStyle = dark ? GOLD : '#1A1A1A';
        ctx.font = '600 283px "Helvetica Neue", Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.fillText('C&G', 0, 0); ctx.restore();

        tagline(ctx, CX, 940, ease(step(t, 1.7, 0.6)));
        return;
      }

      if (style === 'glow') {
        const appear = ease(step(t, 0.1, 0.7));
        // Soft halo behind the badge
        [0.35, 1.55].forEach((start) => {
          const q = step(t, start, 1.0);
          if (q > 0 && q < 1) {
            const r = 330 + 150 * ease(q);
            const grad = ctx.createRadialGradient(CX, CY, 300, CX, CY, r + 80);
            grad.addColorStop(0, 'rgba(212,175,55,' + (0.22 * (1 - q)) + ')');
            grad.addColorStop(1, 'rgba(212,175,55,0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(CX, CY, r + 80, 0, Math.PI * 2); ctx.fill();
          }
        });
        badge(ctx, CX, CY, 0.96 + 0.04 * appear, dark, appear);
        tagline(ctx, CX, 940, ease(step(t, 1.2, 0.6)));
        return;
      }
    }

    function pickMime() {
      const candidates = [
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      return candidates.find((m) => MediaRecorder.isTypeSupported(m)) || '';
    }

    async function render(style, dark) {
      const mime = pickMime();
      if (!mime) { status.textContent = 'MediaRecorder not supported'; return; }
      const ext = 'webm';
      const stream = canvas.captureStream(30);
      const chunks = [];
      const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
      recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      const stopped = new Promise((resolve) => { recorder.onstop = resolve; });

      status.textContent = 'Recording ' + style + ' ...';
      draw(0, style, dark);
      recorder.start();

      const start = performance.now();
      await new Promise((resolve) => {
        function frame(now) {
          const t = (now - start) / 1000;
          draw(t, style, dark);
          if (t < 4.2) requestAnimationFrame(frame);
          else resolve();
        }
        requestAnimationFrame(frame);
      });

      recorder.stop();
      await stopped;
      stream.getTracks().forEach((track) => track.stop());

      const blob = new Blob(chunks, { type: mime });
      if (blob.size < 1000) { status.textContent = 'FAILED · empty recording, please retry'; return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'crown-grove-animation-' + style + '-' + (dark ? 'dark' : 'light') + '.' + ext;
      document.body.appendChild(a);
      a.click();
      a.remove();
      status.textContent = 'DONE · ' + style + ' · ' + blob.size + ' bytes';
    }

    document.querySelectorAll('button[data-style]').forEach((btn) => {
      btn.addEventListener('click', () => render(btn.dataset.style, darkToggle.checked));
    });

    draw(1.6, 'draw', false);
  </script>
</body>
</html>
