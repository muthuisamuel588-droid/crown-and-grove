<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Crown and Grove about poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4D3E"/>
      <stop offset="100%" stop-color="#0A1F18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8CC7A"/>
      <stop offset="100%" stop-color="#C8A951"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.09">
    <circle cx="540" cy="470" r="230"/>
    <circle cx="540" cy="470" r="340"/>
    <circle cx="540" cy="470" r="450"/>
    <circle cx="540" cy="470" r="560"/>
  </g>

  <g transform="translate(540,470)">
    <circle r="150" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <circle r="134" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.55"/>
    <circle cy="-143" r="4" fill="#D4AF37"/>
    <circle cy="143" r="4" fill="#D4AF37"/>
    <text y="44" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="118" font-weight="600" letter-spacing="-6" fill="url(#gold)">C&amp;G</text>
  </g>

  <g font-family="'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="540" y="830" font-size="66" font-weight="600" letter-spacing="7" fill="#FFFFFF">CROWN &amp; GROVE</text>
    <text x="540" y="900" font-size="28" font-weight="500" letter-spacing="4" fill="#D4AF37">WHERE STRATEGY MEETS CREATION</text>
    <line x1="310" y1="952" x2="770" y2="952" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    <text x="540" y="1030" font-size="25" fill="#DDE7E2" font-family="Georgia,serif" font-style="italic">A creative agency building brands that lead,</text>
    <text x="540" y="1072" font-size="25" fill="#DDE7E2" font-family="Georgia,serif" font-style="italic">stories that last, and experiences that perform.</text>
  </g>

  <text x="540" y="1260" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="6" fill="#D4AF37" opacity="0.8">STRATEGY · DESIGN · DIGITAL · GROWTH</text>
</svg>
