<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Crown and Grove call to action poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4D3E"/>
      <stop offset="100%" stop-color="#0A1F18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8CC7A"/>
      <stop offset="100%" stop-color="#C8A951"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.09">
    <circle cx="540" cy="620" r="260"/>
    <circle cx="540" cy="620" r="380"/>
    <circle cx="540" cy="620" r="500"/>
    <circle cx="540" cy="620" r="620"/>
    <circle cx="540" cy="620" r="740"/>
  </g>

  <g transform="translate(540,620)">
    <circle r="170" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <circle r="152" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.55"/>
    <circle cy="-162" r="4.5" fill="#D4AF37"/>
    <circle cy="162" r="4.5" fill="#D4AF37"/>
    <text y="50" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="134" font-weight="600" letter-spacing="-7" fill="url(#gold)">C&amp;G</text>
  </g>

  <g font-family="'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="540" y="960" font-size="58" font-weight="600" letter-spacing="1" fill="#FFFFFF">Let's build something</text>
    <text x="540" y="1032" font-size="58" font-weight="600" letter-spacing="1" fill="#FFFFFF">worth crowning.</text>
    <text x="540" y="1108" font-size="28" font-weight="500" letter-spacing="4" fill="#D4AF37">WHERE STRATEGY MEETS CREATION</text>
  </g>

  <rect x="390" y="1170" width="300" height="62" rx="2" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <text x="540" y="1210" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#D4AF37">LET'S TALK</text>

  <text x="540" y="1290" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#8FB3A4">CROWN &amp; GROVE</text>
</svg>
