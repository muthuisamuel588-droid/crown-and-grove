<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Crown and Grove Digital Experiences advertisement">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B4D3E"/><stop offset="100%" stop-color="#0A1F18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8CC7A"/><stop offset="100%" stop-color="#C8A951"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <g fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.08">
    <circle cx="540" cy="470" r="200"/><circle cx="540" cy="470" r="300"/>
    <circle cx="540" cy="470" r="400"/><circle cx="540" cy="470" r="500"/>
    <circle cx="540" cy="470" r="600"/>
  </g>
  <text x="540" y="250" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="7" fill="#D4AF37">CROWN &amp; GROVE</text>

  <!-- Screen / digital icon -->
  <g transform="translate(540,470)">
    <circle r="150" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <circle r="120" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
    <rect x="-86" y="-62" width="172" height="112" rx="6" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <line x1="-86" y1="-40" x2="86" y2="-40" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="-74" cy="-51" r="3" fill="#D4AF37"/><circle cx="-62" cy="-51" r="3" fill="#D4AF37"/>
    <g stroke="#D4AF37" stroke-width="4" stroke-linecap="round">
      <line x1="-60" y1="-12" x2="-20" y2="-12"/><line x1="-60" y1="6" x2="-36" y2="6"/>
      <line x1="20" y1="-16" x2="60" y2="-16"/><line x1="20" y1="2" x2="48" y2="2"/><line x1="20" y1="20" x2="60" y2="20"/>
    </g>
    <path d="M-120,86 L120,86" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
    <path d="M-20,80 L0,100 L20,80" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g font-family="'Helvetica Neue',Arial,sans-serif" text-anchor="middle">
    <text x="540" y="720" font-size="20" font-weight="700" letter-spacing="5" fill="#8FB3A4">03 / SERVICE</text>
    <text x="540" y="800" font-size="66" font-weight="600" letter-spacing="1" fill="#FFFFFF">Digital Experiences</text>
    <text x="540" y="856" font-size="26" fill="#B9CDC4">Websites, products &amp; interfaces that perform.</text>
    <line x1="330" y1="900" x2="750" y2="900" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    <text x="540" y="952" font-size="20" font-weight="500" letter-spacing="4" fill="#D4AF37">WHERE STRATEGY MEETS CREATION</text>
  </g>
  <rect x="390" y="1000" width="300" height="56" rx="2" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <text x="540" y="1037" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#D4AF37">LET'S TALK</text>
