<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crown &amp; Grove — Wallpapers &amp; Posters</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#F7F4EC; color:#1A1A1A; padding:48px 32px 80px; }
    header { max-width:1200px; margin:0 auto 44px; text-align:center; }
    h1 { font-size:42px; margin:0 0 8px; letter-spacing:.06em; }
    header p { color:#777; font-size:14px; margin:0; }
    .section { max-width:1200px; margin:0 auto 48px; }
    .label { font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:#8A8A8A; font-weight:700; border-bottom:1px solid #DDD8CC; padding-bottom:10px; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:24px; }
    .card { background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:20px; }
    .card img { width:100%; display:block; border:1px solid #E4E0D6; }
    .card .name { font-size:12px; margin-top:12px; color:#555; letter-spacing:.04em; }
    .posters { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
    @media (max-width:900px){ .grid,.posters { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>CROWN &amp; GROVE</h1>
    <p>Wallpapers &amp; posters — Where strategy meets creation</p>
  </header>

  <section class="section">
    <div class="label">Desktop Wallpapers</div>
    <div class="grid">
      <div class="card"><img src="wallpaper/desktop/wallpaper-desktop-1920x1080.png" alt="Desktop wallpaper 1920x1080" /><div class="name">1920 × 1080</div></div>
      <div class="card"><img src="wallpaper/desktop/wallpaper-desktop-2560x1440.png" alt="Desktop wallpaper 2560x1440" /><div class="name">2560 × 1440</div></div>
    </div>
  </section>

  <section class="section">
    <div class="label">Phone Wallpapers</div>
    <div class="grid">
      <div class="card" style="max-width:420px"><img src="wallpaper/phone/wallpaper-phone-1170x2532.png" alt="Phone wallpaper" /><div class="name">1170 × 2532</div></div>
      <div class="card" style="max-width:420px"><img src="wallpaper/phone/wallpaper-phone-1440x3120.png" alt="Phone wallpaper high res" /><div class="name">1440 × 3120</div></div>
    </div>
  </section>

  <section class="section">
    <div class="label">Posters</div>
    <div class="posters">
      <div class="card"><img src="poster/poster-01-about-1080x1350.png" alt="About poster" /><div class="name">01 — About</div></div>
      <div class="card"><img src="poster/poster-02-services-1080x1350.png" alt="Services poster" /><div class="name">02 — Services</div></div>
      <div class="card"><img src="poster/poster-03-cta-1080x1350.png" alt="CTA poster" /><div class="name">03 — Let's Talk</div></div>
    </div>
  </section>
</body>
</html>
