<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Crown and Grove desktop wallpaper">
  <defs>
    <radialGradient id="bg" cx="72%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#1B4D3E"/>
      <stop offset="60%" stop-color="#123327"/>
      <stop offset="100%" stop-color="#0A1F18"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8CC7A"/>
      <stop offset="100%" stop-color="#C8A951"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- tree rings -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.4" opacity="0.10">
    <circle cx="1400" cy="540" r="260"/>
    <circle cx="1400" cy="540" r="380"/>
    <circle cx="1400" cy="540" r="500"/>
    <circle cx="1400" cy="540" r="620"/>
    <circle cx="1400" cy="540" r="740"/>
    <circle cx="1400" cy="540" r="860"/>
    <circle cx="1400" cy="540" r="980"/>
  </g>

  <!-- badge -->
  <g transform="translate(1400,540)">
    <circle r="190" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <circle r="170" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.55"/>
    <circle cy="-181" r="4.5" fill="#D4AF37"/>
    <circle cy="181" r="4.5" fill="#D4AF37"/>
    <text y="56" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="148" font-weight="600" letter-spacing="-8" fill="url(#gold)">C&amp;G</text>
  </g>

  <!-- wordmark -->
  <g font-family="'Helvetica Neue',Arial,sans-serif">
    <text x="180" y="472" font-size="78" font-weight="600" letter-spacing="9" fill="#FFFFFF">CROWN &amp; GROVE</text>
    <line x1="184" y1="512" x2="540" y2="512" stroke="#D4AF37" stroke-width="2"/>
    <text x="184" y="566" font-size="25" font-weight="500" letter-spacing="5.5" fill="#D4AF37">WHERE STRATEGY MEETS CREATION</text>
  </g>
</svg>
